apiVersion: apps/v1
kind: Deployment
metadata:
  name: three
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sat
  template:
    metadata:
      labels:
        app: sat
    spec:
      containers:
      - name: cont-2
        image: nginxdemos/hello
        ports:
        - containerPort: 80
        env:
        - name: TITLE
          value: "APACHE APP2"
---
apiVersion: v1
kind: Service
metadata:
  name: svc3
spec:
  type: ClusterIP
  ports:
  - port: 80
  selector:
    app: sat
